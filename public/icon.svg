<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#glow)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Keyboard frame outline -->
  <g transform="translate(64, 96)">
    <!-- Screen eye / vision pulse at the top -->
    <ellipse cx="192" cy="40" rx="46" ry="24" fill="none" stroke="#00f2fe" stroke-width="4" filter="url(#neon-glow)"/>
    <circle cx="192" cy="40" r="14" fill="#00f2fe"/>
    <circle cx="192" cy="40" r="6" fill="#ffffff"/>

    <!-- Radar / Vision rays -->
    <path d="M120 40 C 130 15, 254 15, 264 40" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>
    <path d="M90 40 C 105 -5, 279 -5, 294 40" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="4,6" opacity="0.5"/>

    <!-- Keyboard base plate -->
    <rect x="0" y="90" width="384" height="230" rx="32" fill="#131b2e" stroke="url(#neon)" stroke-width="4"/>

    <!-- Top AI Assistant Bar on keyboard -->
    <rect x="20" y="110" width="344" height="42" rx="12" fill="#1a253d" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="44" cy="131" r="7" fill="#00f2fe" filter="url(#neon-glow)"/>
    <rect x="62" y="125" width="90" height="12" rx="6" fill="#00f2fe" opacity="0.9"/>
    <rect x="162" y="125" width="60" height="12" rx="6" fill="#7f00ff" opacity="0.7"/>
    <rect x="232" y="125" width="80" height="12" rx="6" fill="#4facfe" opacity="0.6"/>

    <!-- Key row 1 -->
    <g fill="#1f2d47" stroke="#2e3f63" stroke-width="1.5">
      <rect x="20" y="166" width="32" height="34" rx="8"/>
      <rect x="58" y="166" width="32" height="34" rx="8"/>
      <rect x="96" y="166" width="32" height="34" rx="8"/>
      <rect x="134" y="166" width="32" height="34" rx="8"/>
      <rect x="172" y="166" width="40" height="34" rx="8" fill="#7f00ff" stroke="#a855f7" stroke-width="2"/>
      <rect x="218" y="166" width="32" height="34" rx="8"/>
      <rect x="256" y="166" width="32" height="34" rx="8"/>
      <rect x="294" y="166" width="32" height="34" rx="8"/>
      <rect x="332" y="166" width="32" height="34" rx="8"/>
    </g>

    <!-- Key row 2 -->
    <g fill="#1f2d47" stroke="#2e3f63" stroke-width="1.5">
      <rect x="30" y="210" width="34" height="34" rx="8"/>
      <rect x="70" y="210" width="34" height="34" rx="8"/>
      <rect x="110" y="210" width="34" height="34" rx="8"/>
      <rect x="150" y="210" width="34" height="34" rx="8"/>
      <rect x="190" y="210" width="34" height="34" rx="8"/>
      <rect x="230" y="210" width="34" height="34" rx="8"/>
      <rect x="270" y="210" width="34" height="34" rx="8"/>
      <rect x="310" y="210" width="44" height="34" rx="8" fill="#00f2fe" fill-opacity="0.3" stroke="#00f2fe"/>
    </g>

    <!-- Key row 3: spacebar with neural glow -->
    <g>
      <rect x="30" y="254" width="48" height="34" rx="8" fill="#182338" stroke="#2e3f63"/>
      <rect x="88" y="254" width="180" height="34" rx="10" fill="url(#neon)" filter="url(#neon-glow)" opacity="0.85"/>
      <rect x="278" y="254" width="76" height="34" rx="8" fill="#251642" stroke="#7f00ff" stroke-width="2"/>
    </g>
  </g>
</svg>
